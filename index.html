<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sound Pad">
<link rel="manifest" href="manifest.json">
<title>Sound Pad</title>
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#1b1f2a;--muted:#aab1c2;--line:#343b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 14px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
button{font:inherit;border:0;color:inherit;cursor:pointer}.action{background:#30384a;border:1px solid #48536a;border-radius:12px;padding:10px 13px;font-weight:650}.primary{background:#4f73e8;border-color:#4f73e8}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.padcard{min-width:0;border:2px solid #ffffff22;border-radius:18px;padding:9px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 16px #0003;background:#526fe5;touch-action:pan-y}
.padcard.editing{outline:2px dashed #fff;outline-offset:2px}
.playbtn{width:100%;min-height:60px;border-radius:12px;background:#0002;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:manipulation}
.playbtn:active,.mini-action:active{filter:brightness(1.25);transform:scale(.98)}.playbtn .name{font-size:14px;font-weight:750;line-height:1.2;text-align:center;overflow-wrap:anywhere}.playbtn .hint{font-size:10px;opacity:.8}
.padcard.large{grid-column:span 2}.padcard.large .playbtn{min-height:84px}.padcard.small .playbtn{min-height:44px}.padcard.small{padding:7px;gap:6px}
.card-controls{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px}.volume-wrap{min-width:0;display:flex;align-items:center;gap:5px;font-size:10px}.volume-wrap input{width:100%;min-width:35px;accent-color:white;padding:0;margin:0;height:24px}.volume-value{font-variant-numeric:tabular-nums;min-width:28px;text-align:right;font-size:10px}
.mini-action{border:1px solid #ffffff55;border-radius:9px;background:#0003;padding:7px 8px;font-size:11px;font-weight:700;white-space:nowrap}.loop-action.active{background:#f5c542;color:#191919;border-color:#f5c542}
.empty{border:1px dashed var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted);grid-column:1/-1;line-height:1.7}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 2px}#status{font-size:12px;color:#aeb9d0;min-height:18px;margin:8px 2px}
dialog{width:min(440px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;background:#1b1f2a;color:#f7f8fb;padding:18px;box-shadow:0 20px 80px #0009}
dialog::backdrop{background:#0009}dialog h2{font-size:18px;margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;border:1px solid #41495b;border-radius:10px;background:#10141d;color:white;padding:11px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#fileInput{display:none}.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header><div><h1>Sound Pad</h1><div class="sub">タップして音声を重ねて再生</div></div><button class="action primary" id="addBtn">＋ 音声追加</button></header>
<div class="toolbar"><button class="action" id="editBtn">配置・編集</button><button class="action" id="stopBtn">■ すべて停止</button><button class="action" id="sortBtn">並び替え解除</button></div>
<input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" multiple>
<div id="pad"><div class="empty">「＋ 音声追加」から音声ファイルを選ぶと<br>ここに再生ボタンが作られます。</div></div>
<div id="status"></div>
<p class="note">音声はこの端末のブラウザ内に保存されます。再生ボタンで通常再生、LOOPボタンでその音声だけのループ再生をON/OFFできます。音量は音声ごとに調整でき、■ボタンで個別停止できます。複数の音声を重ねて再生できます。</p>
<dialog id="editDialog">
<h2>ボタンの設定</h2>
<div class="field"><label for="nameInput">表示名</label><input id="nameInput" maxlength="40"></div>
<div class="field"><label for="colorInput">ボタンの色</label><input id="colorInput" type="color" value="#526fe5"></div>
<div class="field"><label for="sizeInput">ボタンの大きさ</label><select id="sizeInput"><option value="normal">標準</option><option value="large">大きめ</option><option value="small">小さめ</option></select></div>
<div class="dialog-actions"><button class="action" id="deleteBtn">削除</button><button class="action" id="cancelEdit">キャンセル</button><button class="action primary" id="saveEdit">保存</button></div>
</dialog>
<script>
const DB_NAME='soundpad-db', STORE='sounds';
let db,sounds=[],editMode=false,editingId=null;
const activeAudio=new Map(),loopAudio=new Map();
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbPut(item){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function dbDelete(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function dbAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function saveOrder(){localStorage.setItem('soundpad-order',JSON.stringify(sounds.map(x=>x.id)))}
function ordered(items){const ids=JSON.parse(localStorage.getItem('soundpad-order')||'[]');return [...items].sort((a,b)=>{let x=ids.indexOf(a.id),y=ids.indexOf(b.id);return (x<0?9999:x)-(y<0?9999:y)})}
function addActive(id,audio){if(!activeAudio.has(id))activeAudio.set(id,new Set());activeAudio.get(id).add(audio)}
function removeActive(id,audio){const set=activeAudio.get(id);if(set){set.delete(audio);if(!set.size)activeAudio.delete(id)}if(loopAudio.get(id)===audio)loopAudio.delete(id)}
function stopOne(id){const set=activeAudio.get(id);if(set){for(const a of [...set]){a.pause();a.currentTime=0;a.src='';removeActive(id,a)}}loopAudio.delete(id);render()}
function makeAudio(s,isLoop){const audio=new Audio(URL.createObjectURL(s.blob));audio.volume=Math.max(0,Math.min(1,Number(s.volume??1)));audio.loop=!!isLoop;addActive(s.id,audio);if(isLoop)loopAudio.set(s.id,audio);const cleanup=()=>{removeActive(s.id,audio);if(audio.src.startsWith('blob:'))URL.revokeObjectURL(audio.src);render()};audio.addEventListener('ended',cleanup,{once:true});audio.addEventListener('error',()=>{cleanup();$('status').textContent='この音声形式を再生できませんでした。'},{once:true});return audio}
async function play(s){try{const audio=makeAudio(s,false);await audio.play();$('status').textContent=`再生中：${s.name}`;}catch(e){$('status').textContent='再生できませんでした。もう一度ボタンを押してください。'}}
async function toggleLoop(s){const current=loopAudio.get(s.id);if(current){current.pause();current.currentTime=0;current.src='';removeActive(s.id,current);render();$('status').textContent=`ループ停止：${s.name}`;return}try{const audio=makeAudio(s,true);await audio.play();render();$('status').textContent=`ループ再生中：${s.name}`;}catch(e){removeActive(s.id,audio);$('status').textContent='ループ再生を開始できませんでした。'}}
function render(){const pad=$('pad');pad.innerHTML='';if(!sounds.length){pad.innerHTML='<div class="empty">「＋ 音声追加」から音声ファイルを選ぶと<br>ここに再生ボタンが作られます。</div>';return}
 sounds.forEach(s=>{const card=document.createElement('div');card.className=`padcard ${s.size||'normal'}${editMode?' editing':''}`;card.style.background=s.color||'#526fe5';
 const main=document.createElement('button');main.className='playbtn';const name=document.createElement('span');name.className='name';name.textContent=s.name;const hint=document.createElement('span');hint.className='hint';hint.textContent=editMode?'タップして設定':'▶ PLAY';main.append(name,hint);main.onclick=()=>editMode?openEdit(s.id):play(s);card.appendChild(main);
 if(!editMode){const controls=document.createElement('div');controls.className='card-controls';const volume=document.createElement('label');volume.className='volume-wrap';volume.textContent='音量';const slider=document.createElement('input');slider.type='range';slider.min='0';slider.max='1';slider.step='0.01';slider.value=String(s.volume??1);slider.setAttribute('aria-label',`${s.name}の音量`);const val=document.createElement('span');val.className='volume-value';val.textContent=`${Math.round((s.volume??1)*100)}%`;slider.oninput=()=>{const v=Number(slider.value);s.volume=v;val.textContent=`${Math.round(v*100)}%`;const set=activeAudio.get(s.id);if(set)for(const a of set)a.volume=v;};slider.onchange=async()=>{try{await dbPut(s)}catch(e){$('status').textContent='音量設定を保存できませんでした。'}};volume.append(slider,val);
 const loop=document.createElement('button');loop.className='mini-action loop-action'+(loopAudio.has(s.id)?' active':'');loop.textContent=loopAudio.has(s.id)?'LOOP ON':'LOOP';loop.setAttribute('aria-label',`${s.name}のループ切り替え`);loop.onclick=()=>toggleLoop(s);
 const stop=document.createElement('button');stop.className='mini-action';stop.textContent='■';stop.setAttribute('aria-label',`${s.name}を停止`);stop.onclick=()=>{stopOne(s.id);$('status').textContent=`停止：${s.name}`};controls.append(volume,loop,stop);card.appendChild(controls);
 }else{const editHint=document.createElement('div');editHint.className='small';editHint.textContent='タップして名前・色・サイズを変更';editHint.style.textAlign='center';card.appendChild(editHint)}
 pad.appendChild(card);
 });}
$('addBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{const files=[...e.target.files];let added=0;for(const f of files){if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(f.name))continue;const item={id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),blob:f,color:['#526fe5','#168c83','#b45a83','#a66a32','#6656a8','#387aab'][sounds.length%6],size:'normal',volume:1};await dbPut(item);sounds.push(item);added++}saveOrder();sounds=ordered(sounds);render();$('status').textContent=`${added} 件のファイルを追加しました。`;e.target.value=''};
$('editBtn').onclick=()=>{editMode=!editMode;$('editBtn').textContent=editMode?'編集を終了':'配置・編集';render()};
function openEdit(id){const s=sounds.find(x=>x.id===id);if(!s)return;editingId=id;$('nameInput').value=s.name;$('colorInput').value=s.color||'#526fe5';$('sizeInput').value=s.size||'normal';$('editDialog').showModal()}
$('cancelEdit').onclick=()=>$('editDialog').close();
$('saveEdit').onclick=async()=>{const s=sounds.find(x=>x.id===editingId);if(!s)return;s.name=$('nameInput').value.trim()||'音声';s.color=$('colorInput').value;s.size=$('sizeInput').value;await dbPut(s);$('editDialog').close();render()};
$('deleteBtn').onclick=async()=>{if(!confirm('この音声ボタンを削除しますか？'))return;stopOne(editingId);await dbDelete(editingId);sounds=sounds.filter(x=>x.id!==editingId);saveOrder();$('editDialog').close();render()};
$('stopBtn').onclick=()=>{for(const id of [...activeAudio.keys()])stopOne(id);$('status').textContent='すべて停止しました。'};
$('sortBtn').onclick=()=>{localStorage.removeItem('soundpad-order');sounds.sort((a,b)=>a.name.localeCompare(b.name,'ja'));saveOrder();render()};
(async()=>{try{db=await openDB();sounds=ordered(await dbAll());sounds.forEach(s=>{if(s.volume===undefined)s.volume=1});render()}catch(e){$('status').textContent='保存領域を開けませんでした。Safariで開き直してください。'}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
</script>
</body></html>
